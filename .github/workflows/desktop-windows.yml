name: Desktop Windows

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  push:
    branches: [feature/forge-web, main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build interface embarcada
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Build executável Rust
        run: cargo build --release --locked

      - name: Preparar payload do instalador
        shell: pwsh
        run: |
          $payload = Join-Path $PWD 'packaging/windows/payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Copy-Item 'target/release/EngLaTeX.exe' (Join-Path $payload 'EngLaTeX.exe')
          & './packaging/windows/Get-Tectonic.ps1' -Destination $payload
          $loader = Get-ChildItem -Path @($PWD, "$env:USERPROFILE\.cargo\registry\src") -Recurse -Filter 'WebView2Loader.dll' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($loader) {
            Copy-Item $loader.FullName (Join-Path $payload 'WebView2Loader.dll') -Force
          } else {
            Write-Warning 'WebView2Loader.dll não foi localizado; o pacote pode depender do loader instalado pelo runtime.'
          }
          Copy-Item 'LEIA-ME.txt' (Join-Path $payload 'LEIA-ME.txt')

      - name: Smoke test do servidor interno
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './packaging/windows/payload/EngLaTeX.exe' -ArgumentList '--servidor','--porta','18000','--pasta',($env:TEMP + '\EngLaTeX-ci') -PassThru
          try {
            $ok = $false
            1..30 | ForEach-Object {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:18000/' -UseBasicParsing
                if ($response.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'O servidor interno do EngLaTeX não respondeu em 15 segundos.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Gerar instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '../../dist/desktop' | Out-Null
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" 'packaging/windows/EngLaTeX.iss'

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: EngLaTeX-windows-x64
          path: dist/desktop/EngLaTeX-*-setup-x64.exe
          if-no-files-found: error
          retention-days: 14
