name: Web checks

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "tests/**"
      - "docs/contracts/forge-project-v1.schema.json"
      - "docs/contracts/PROJECT-ARCHIVE-V1.md"
      - "package.json"
      - ".github/workflows/web-checks.yml"

concurrency:
  group: forge-web-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run web core tests
        run: npm run test:web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:web:browser
